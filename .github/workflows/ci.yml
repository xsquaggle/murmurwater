name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Automated playthrough (headless Chromium)
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 &
          sleep 3
          mkdir -p shots
          node e2e/play.cjs shots
      - name: Story bot (whole Hearthbay chain)
        run: node e2e/story.cjs shots/story
        env:
          MW_QUALITY: low
      - name: Sail bot (the skiff with the real helm: both sailing quests, the chart, the shore, the fog, a save at sea)
        run: node e2e/sail.cjs shots/sail
        env:
          MW_QUALITY: low
      - name: Walk bot (solid props and people, everyone reachable on foot)
        run: node e2e/walk.cjs shots/walk
        env:
          MW_QUALITY: low
      - name: Fish shadows bot (a shadow reaches the float before the bite)
        run: node e2e/shadows.cjs shots/shadows
        env:
          MW_QUALITY: low
      - name: Audio bot (every sound loads, the game triggers the recordings, the mix does not clip)
        run: node e2e/audio.cjs
      - name: Electron smoke test (models, voices load from the packaged entry)
        run: xvfb-run -a node e2e/electron-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playthrough-screenshots
          path: shots/
