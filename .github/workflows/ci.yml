name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Automated playthrough (headless Chromium)
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 &
          sleep 3
          mkdir -p shots
          node e2e/play.cjs shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playthrough-screenshots
          path: shots/
